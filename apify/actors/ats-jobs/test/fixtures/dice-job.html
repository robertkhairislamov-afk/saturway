<html><head><script type="application/ld+json">{
  "@context": "https://schema.org",

  "title": "Principal Data Engineer",
  "description": "\u003cb>Overview\u003c/b> \u003cbr /> \u003cbr /> \u003cstrong>Navy Federal Credit Union currently does not provide sponsorship for this role. Applicants must be authorized to work in the United States without the need for current or future sponsorship.\u003c/strong> \u003cbr />\u003cbr />The Principal Data Engineer will provide senior-level engineering expertise, architectural direction, and technical ownership across enterprise Data and Analytics Modernization initiatives. This role is responsible for advancing the organization's data strategy by modernizing legacy data and analytics ecosystems, enabling trusted and governed data products, and accelerating AI and analytics capabilities through scalable, cloud-native architectures.\u003cbr />\u003cbr />The role will design and implement scalable cloud data pipelines, modernize legacy Analytical Data Stores and BI workloads, strengthen data quality controls, automate validation and reconciliation processes, and enable governed data consumption through enterprise data platform powered by Azure, Databricks, Microsoft Fabric, Power BI, Tableau, Alation, and related tools.\u003cbr /> \u003cbr />\u003cb>Responsibilities\u003c/b> \u003cbr /> \u003cul>\u003cli>Provide technical leadership and hands-on engineering expertise for Enterprise Data and Analytics Modernization initiatives across data engineering, analytics, reporting, and data consumption.\u003c/li>\u003cli>Design, develop, and optimize scalable batch, near real-time, and real-time data pipelines using Spark, Python, SQL, Databricks, Microsoft Fabric, Azure Data Factory, and related Azure cloud services.\u003c/li>\u003cli>Modernize legacy Analytical Data Store and BI workloads by migrating fragmented reporting and data assets into secure, standardized, governed, and cloud-native analytics platforms.\u003c/li>\u003cli>Lead the design and implementation of API-driven and event-based data onboarding patterns leveraging enterprise API management, integration, and streaming platforms (Gravitee, MuleSoft, Kafka, and related technologies) to deliver secure, scalable, and reusable data ingestion capabilities for analytics, AI, and data products.\u003c/li>\u003cli>Establish reusable engineering ETL frameworks, design patterns, and automation capabilities for ingestion, transformation, validation, reconciliation, monitoring, and production support.\u003c/li>\u003cli>Implement automated data quality validation, reconciliation controls, exception handling, alerting, monitoring, SLA management, and production readiness practices.\u003c/li>\u003cli>Enable metadata management, lineage, cataloging, and access governance through tools such as Unity Catalog, Alation, and related governance capabilities.\u003c/li>\u003cli>Partners with data architects, analysts, product owners, business stakeholders, governance teams, and platform teams to translate business needs into scalable technical solutions.\u003c/li>\u003cli>Guide engineering teams through architecture reviews, implementation decisions, coding practices, design standards, performance tuning, and operational resilience improvements.\u003c/li>\u003cli>Ensure compliance with Navy Federal, industry engineering, information security, data governance, and regulatory expectations for secure and reliable data solutions.\u003c/li>\u003cli>Support Agile delivery, DevSecOps practices, CI/CD deployment, release readiness, defect resolution, and production support for critical modernization deliverables.\u003c/li>\u003cli>Mentor senior and mid-level engineers, promote engineering excellence, and drive adoption of enterprise standards for cloud data engineering and analytics modernization.\u003c/li>\u003c/ul> \u003cbr />\u003cb>Qualifications\u003c/b> \u003cbr /> \u003cul>\u003cli>Bachelor's degree in information systems, Computer Science, Engineering, Data Engineering, or a related field, or the equivalent combination of education, training, and experience.\u003c/li>\u003cli>Advanced hands-on expertise in Spark, Python, SQL, Databricks, Azure Data Factory, Microsoft Fabric, and cloud-native data integration, transformation, and analytics solutions.\u003c/li>\u003cli>Strong experience in designing, building, and supporting scalable data pipelines, lakehouse architecture, data warehouses, data marts, and analytical data stores.\u003c/li>\u003cli>Expertise in automated data quality validation, data reconciliation, metadata management, lineage, monitoring, alerting, error handling, and SLA management.\u003c/li>\u003cli>Experience with governance and catalog platforms such as Unity Catalog, Alation, or similar tools.\u003c/li>\u003cli>Experience with BI and analytics platforms such as Power BI, Tableau, Microsoft Fabric, and enterprise reporting modernization patterns.\u003c/li>\u003cli>Working knowledge of Azure DevOps, CI/CD pipelines, Agile delivery, production deployment, and operational support practices.\u003c/li>\u003cli>Ability to communicate complex technical concepts clearly to business stakeholders, technology leaders, engineers, and cross-functional delivery teams.\u003c/li>\u003cli>Strong problem-solving skills, architectural judgment, ownership mindset, and ability to lead delivery in complex, highly regulated enterprise environments.\u003c/li>\u003c/ul>\u003cbr />\u003cbr />\u003cstrong>Desired Qualifications \u003c/strong>\u003cbr />\u003cul>\u003cli>Master's degree in computer science, Information Technology, Engineering, Analytics, or a related discipline.\u003c/li>\u003cli>Experience modernizing legacy BI environments, Analytical Data Stores, and on-premises reporting platforms into Azure, Databricks, Microsoft Fabric, or similar cloud-native solutions.\u003c/li>\u003cli>Experience supporting enterprise Analytics Data Modernization across business, operational, risk, finance, member, or enterprise data and analytics domains.\u003c/li>\u003cli>Experience with AI-ready data product design, feature preparation, data observability, and governed self-service analytics capabilities.\u003c/li>\u003cli>Knowledge of financial services data governance, regulatory traceability, audit readiness, data privacy, information security, and operational risk management expectations.\u003c/li>\u003cli>Demonstrated ability to mentor engineering teams, establish reusable frameworks, influence technical standards, and drive enterprise-scale modernization outcomes.\u003c/li>\u003c/ul>\u003cbr />\u003cbr />\u003cstrong>Additional Information\u003c/strong>\u003cbr />\u003cbr />\u003cstrong>Hours:\u003c/strong>\u003cbr />\u003cul>\u003cli>Monday - Friday, 8:00AM - 4:30PM\u003c/li>\u003c/ul>\u003cbr />\u003cbr />\u003cstrong>Location:\u003c/strong>\u003cbr />\u003cul>\u003cli>820 Follin Lane, Vienna, VA 22180\u003c/li>\u003c/ul> \u003cbr />\u003cb>About Us\u003c/b> \u003cbr /> Navy Federal provides much more than a job. We provide a meaningful career experience, including a culture that is energized, engaged and committed; and fierce appreciation for our teams, who are rewarded with highly competitive pay and generous benefits and perks. \u003cbr /> \u003cbr />Our approach to careers is simple yet powerful: Make our mission your passion.\u003cbr /> \u003cbr />  FORTUNE 100 Best Companies to Work For  2026\u003cbr /> \u003cbr />  Yello and WayUp Top 100 Internship Programs 2025\u003cbr /> \u003cbr />  Computerworld  Best Places to Work in IT 2026\u003cbr /> \u003cbr />  Most Loved Workplace - America's Top Most Loved Workplaces  2025\u003cbr /> \u003cbr />  2025 PEOPLE  Companies That Care\u003cbr /> \u003cbr />  Newsweek Most Trustworthy Companies in America 2026\u003cbr /> \u003cbr />  Military Times 2025 Best for Vets Employers\u003cbr /> \u003cbr />  Forbes  2026 America's Best Large Employers\u003cbr /> \u003cbr />  Forbes  2025 America's Best Employers for New Grads\u003cbr /> \u003cbr />  Forbes  2025 America's Best Employers for Tech Workers\u003cbr /> \u003cbr />  2025 RippleMatch Campus Forward Award Winner for Overall Excellence\u003cbr /> \u003cbr />  Military.com Top Military Spouse Employers 2025\u003cbr /> \u003cbr />  2026 Handshake Early Talent Award\u003cbr /> \u003cbr />  Newsweek America's Greatest Workplaces for Culture, Belonging and Community 2026\u003cbr /> \u003cbr />From Fortune Magazine.   2026 Fortune Media IP Limited. All rights reserved. Used under license. Fortune and Fortune 100 Best Companies to Work For are registered trademarks of Fortune Media IP Limited and are used under license. Fortune Magazine, Fortune Media (USA) Corporation, and its affiliates are not affiliated with, and do not endorse products or services of, Navy Federal Credit Union.\u003cbr /> \u003cbr />\u003cb>Equal Employment Opportunity:\u003c/b> All qualified applicants will receive consideration for employment without regard to age, race, sex, color, religion, national origin, disability, veteran status, pregnancy, sexual orientation, genetic information, gender identity or any other basis protected by applicable law.\u003cbr /> \u003cbr />\u003cb>Accommodations:\u003c/b> If you need accommodation or assistance for a qualifying condition to complete the online application (or during any stage of the hiring process), you can contact Navy Federal's Medical Accommodations team at  or by calling 1-. This team cannot provide any information on job postings or application status.\u003cbr /> \u003cbr />\u003cb>Disclaimers:\u003c/b> Navy Federal reserves the right to fill this role at a higher/lower grade level based on business need. An assessment may be required to compete for this position. Job postings are subject to close early or extend out longer than the anticipated closing date at the hiring team's discretion based on qualified applicant volume. Navy Federal Credit Union assesses market data to establish salary ranges that enable us to remain competitive. You are paid within the salary range, based on your experience, location and market position. For additional details re
