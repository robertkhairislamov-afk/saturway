t app, you can play millions of songs, albums and original podcasts for free. We have even added audiobooks, so you can enjoy thousands of stories wherever you are!<br><br>Stream music and podcasts, listen to audiobooks, discover albums, playlists or even single songs for free on your mobile or tablet. Subscribe to Spotify Premium to download and listen offline wherever you are.<br><br>Spotify gives you access to a world of free music, curated playlists, artists, and podcasts you love. Discover podcasts, new music, top songs or listen to your favorite artists and albums.<br><br>WHY SPOTIFY FOR MUSIC AND PODCASTS?<br>• Listen to over 80 million songs and 4 million podcasts (and counting)<br>• Enjoy over 300,000 newly added audiobook titles<br>• Discover new music, albums, playlists and original podcasts.<br>• Search for your favorite song or artist by typing a lyric<br>• Enjoy amazing sound quality on music and podcasts across all devices.<br>• Create and share your own music playlists to suit your mood or discover other playlists you might like.<br>• Listen to daily music mixes made just for you.<br>• Explore top songs from different genres, countries or decades.<br>• Subscribe to your favourite podcasts so that you never miss an episode, then curate your very own podcast library.<br>• Bookmark individual podcasts into Playlists<br>• Listen to music and podcasts on your mobile, tablet, desktop, PlayStation, Chromecast, TV, Wear OS or wearable device.<br><br>Listen and discover the latest music from artists like;<br>• Bad Bunny<br>• Billie Eilish<br>• Renzo Pianciola<br>• The Temper Trap<br>• Harry Styles<br><br>Listen to your favorite music artists all day every day via the Popular Radio playlist feature. Here are just some of the artists we’ve already curated;<br>• Taylor Swift<br>• Drake<br>• Eminem<br>• Coldplay<br>• Paolo Nutini<br>• Fleetwood Mac<br><br>Listen to over 40 category genres - New Releases, Charts, Live Events, Made for You, At Home, Only You, Summer, Pop, Workout, Hip-Hop, Mood, Party, Pride, Dance/Electronic, Alternative, Indie, Equal, Wellness, Rock, Frequency, R&amp;B, Disney,, Throwback, Radar, Chill, Sleep, In the car, Kids &amp; Family, Caribbean, Classical, Romance, Jazz, Instrumental, Afro, Christian and Gospel and Country.<br><br>Listen to popular and exclusive podcasts like;<br>• The Joe Rogan Experience<br>• Modern Wisdom<br>• 2 Bears, 1 Cave with Tom Segura and Bert Kreischer<br>• Call Her Daddy and Crime Junkie<br><br>Search, discover and play music, podcasts and audiobooks from all over the world for free, anywhere, anytime or create your own music playlists with the latest songs to suit your mood.<br><br>WHY GO PREMIUM?<br>• Listen to albums and playlists without ad breaks.<br>• Download and listen to music and podcasts offline, wherever you are.<br>• Jump back in and listen to your top songs with on-demand playback.<br>• Choose from 4 subscription options – Individual, Duo, Family, Student. There’s no commitment and you can cancel any time<br><br>Audiobooks in Premium currently available in Australia, the UK &amp; the US. Discover 250,000+ titles, 15 hours/month of available listening for Premium Individual subscribers and Duo &amp; Family plan managers.<br><br>Experience Spotify on your Wear OS device:<br>• Enjoy your favourite music and podcasts without having your phone around.<br>• Control playback on your phone or any of your Spotify compatible devices.<br>• Download your favourite content for offline listening on the go (Premium only).<br>• Get instant access to Spotify with our Tiles and Complications.<br><br>Please note: This app features Nielsen’s audience measurement software which will allow you to contribute to market research, such as Nielsen’s Audio Measurement. If you don&#39;t want to participate, you can opt-out within the app settings. To learn more about our digital audience measurement products and your choices in regard to them, please visit https://www.nielsen.com/digital
