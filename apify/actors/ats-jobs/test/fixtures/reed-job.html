<!DOCTYPE html><html><head></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"consolidatedJobDetails":{"jobDetails":{"id":57363584,"title":"AWS/Python Software Engineer","description":"<p><strong>Senior to Staff Software Engineer</strong></p><p>We're looking for an experienced Senior to Staff Software Engineer to join our Engineering team and help us build technology that's changing the way people use and interact with energy.</p><p>At E.ON Next, we're tackling some of the biggest challenges facing the energy industry - from affordability and sustainability to creating better experiences for our customers. Technology is at the heart of that, and you'll play an important role in building the products and platforms that make it happen.</p><p>You'll join a collaborative, high-performing engineering team working across multiple areas of the business. We build full-stack cloud solutions, with Python at the heart of our backend and a serverless-first approach using AWS services such as Lambda, DynamoDB, RDS and AppSync.</p><p>We care about building things well, moving quickly and continually improving how we work. You'll have the opportunity to influence technical direction, solve complex problems and help those around you grow.</p><p><br></p><p><strong>Here's a taste of what you'll be doing:</strong></p><p>Build great technology</p><ul><li><p>Design, build and evolve scalable full-stack applications using Python and AWS.</p></li><li><p>Take a serverless-first approach to designing robust, maintainable cloud solutions.</p></li><li><p>Plan, build, test and release new features, products and experiments.</p></li><li><p>Tackle complex technical challenges involving large-scale systems and high volumes of data.</p></li><li><p>Contribute to technical design and architectural decisions, helping shape solutions from the ground up.</p></li></ul><p><br></p><p>Lead through technical expertise</p><ul><li><p>Provide technical leadership within your squad and help set high standards for engineering excellence.</p></li><li><p>Support and develop other engineers through mentoring, pair programming and constructive code reviews.</p></li><li><p>Champion modern engineering practices, including TDD, automated testing and continuous improvement.</p></li><li><p>Share knowledge, challenge ideas constructively and help create an environment where engineers can do their best work.</p></li></ul><p><br></p><p>Collaborate and make an impact</p><ul><li><p>Work closely with Product, Data, Front-end, Platform, Security and Design teams to turn ideas into great products.</p></li><li><p>Work in an agile environment where engineers have a genuine voice in how we solve problems.</p></li><li><p>Translate complex technical challenges into clear, practical solutions.</p></li><li><p>Continuously look for better ways of working, improving both our technology and the experience of the teams building it.</p></li></ul><p><br></p><p><strong>Are we the perfect match?</strong></p><p><br></p><p>We're looking for someone with strong technical foundations who can combine hands-on engineering with technical leadership.</p><p>You'll ideally bring:</p><ul><li><p>Proven experience working as a Senior Engineer, Staff Software Engineer or Team Lead.</p></li><li><p>Experience providing technical leadership within an engineering squad or similar environment.</p></li><li><p>Strong experience with Python, or transferable software engineering experience and a willingness to develop in Python.</p></li><li><p>Experience building and working with RESTful APIs and/or GraphQL.</p></li><li><p>Experience with AWS or other cloud technologies and an understanding of cloud-native application design.</p></li><li><p>Strong knowledge of software engineering principles and development practices such as TDD, automated testing, pair programming and code review.</p></li><li><p>Excellent software design, problem-solving and debugging skills.</p></li><li><p>Experience using Git or other version control systems.</p></li><li><p>The ability to communicate technical concepts clearly and collaborate effectively with both technical and non-technical colleagues.</p></li><li><p>A genuine curiosity for technology and a desire to keep learning, experiment with new approaches and continuously improve.</p></li></ul><p><br></p><p>Don't worry if you don't tick every box. We're more interested in what you can bring, how you approach problems and your appetite to learn than whether your experience matches every point above. If you're an experienced engineer who enjoys solving complex problems and helping teams build better software, we'd love to hear from you.</p><p><br></p><p><strong>Here's what else you need to know: </strong></p><ul><li><p><strong>Role may close earlier due to high applications.</strong></p></li><li><p>Competitive salary  </p></li><li><p>Location - <strong>London </strong>- E.ON Next, 47-53 Charterhouse Street, Farringdon, London, EC1M 6PB  - with travel to our other sites when required. </p></li><li><p>Excellent parental leave allowance. </p></li><li><p><strong>Award-Winning Workplace</strong> - We're proud to be named a <strong>Sunday Times Best Place to Work 2025</strong> and the <strong>Best Place to Work for 16-34-year-olds</strong></p></li><li><p><strong>Outstanding Benefits</strong> - Enjoy 26 days of annual leave plus bank holidays, a generous pension, life cover, bonus opportunities and access to 20 flexible benefits with tax/NI savings </p></li><li><p><strong>Flexible & Family-Friendly</strong> - Our industry-leading hybrid and family-friendly policies earned us double recognition at the <strong>Personnel Today Awards 2024</strong>. We're open to discussing how flexibility can work for you </p></li><li><p><strong>Inclusive & Diverse</strong> - We're the only energy company in the <strong>Inclusive Top 50 UK Employers</strong>. We're also proud winners of <strong>Best Employer for Women</strong> and <strong>Human Company of the Year</strong>-recognising our inclusive, people-first culture </p></li><li><p><strong>Support at Every Stage of Life</strong> - We're <strong>Fertility Friendly</strong> and <strong>Menopause Friendly</strong> accredited, with inclusive support for everyone </p></li><li><p><strong>Accessible & Supportive</strong> - Do you consider yourself as having a disability? As a Disability Confident Employer, we guarantee interviews for disabled applicants who meet the minimum criteria for the role and will make any adjustments needed during the process </p></li><li><p><strong>Invested in Your Growth</strong> - From inclusive talent networks to top-tier development programmes, we'll support your growth every step of the way </p></li><li><p>For all successful candidates.  Due to the nature of this role your employment will be subject to a basic DBS (Disclosure Barring Service) check being carried out by ourselves via a 3rd party service provider </p></li><li><p><strong>Any questions on the role - </strong>please reach out to </p></li></ul><p><br></p><p><br></p>","createdDate":"2026-09-18T13:29:28.19","updatedDate":"2026-09-26T13:32:18.4","displayDate":"2026-09-18T13:29:28.17","expiryDate":"2026-10-02T23:55:00","nextRefreshDate":"2026-09-26T13:29:28","isFeatured":false,"isGraduate":false,"isManageExec":true,"isMultilingual":false,"isPromoted":false,"isPublic":false,"isLive":true,"isSuspended":false,"isTrainingJob":false,"hasEligibilityToWorkInUk":true,"jobApplicationEligibilityRequirement":"requiresEligibility","taxonomy":"Occupation/KD: Information Technology/Engineer/Software Engineer/Software Engineer Python","breadcrumbs":["Information Technology","Engineer","Software Engineer"],"jobCoverLetterPreference":{"id":3,"name":"None"},"jobOwner":{"ecId":24538309,"ouId":385714,"organisationId":null,"companyProfileId":null,"reference":"JR103994","ouType":2,"companyProfileUrl":null,"profileId":2345,"profileName":null,"profileLogoImage":null,"profileBanne
